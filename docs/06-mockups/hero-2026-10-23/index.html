<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>FISAR — hero approvata</title>
  <link rel="stylesheet" href="../../../theme/fisar-cdj/assets/css/main.css">
  <link rel="stylesheet" href="preview.css">
  <script src="classic-carousel.js" defer></script>
  <script src="approved.js" defer></script>
</head>
<body class="review-toned">
  <header class="review-header">
    <div class="container">
      <img src="../../../theme/fisar-cdj/assets/images/logo-orizzontale-header.svg" width="208" height="72" alt="FISAR Castelli di Jesi">
    </div>
  </header>
  <main id="main-content">
    <section class="hero hero--collage hero--glass hero--review-moving hero--review-classic" aria-labelledby="hero-title">
      <div class="container hero__inner">
        <div class="hero__content">
          <h1 id="hero-title"><span>FISAR</span> <span>Delegazione</span> <span>Castelli di Jesi</span></h1>
          <p class="hero__payoff"><span>Il vino come punto di partenza,</span> <span>le persone al centro.</span></p>
          <p class="hero__description">Corsi per sommelier, degustazioni e incontri per conoscere il mondo del vino.</p>
          <div class="hero__actions">
            <a class="button" href="https://www.fisarcastellidijesi.it/anteprima/corsi/">Scopri i corsi</a>
            <a class="button button--outline-light" href="https://www.fisarcastellidijesi.it/anteprima/eventi/">Scopri gli eventi</a>
          </div>
        </div>
        <div class="hero__album">
          <figure class="wp-block-gallery hero-collage review-classic" aria-label="Momenti della Delegazione"></figure>
          <div class="hero__glass" aria-hidden="true">
            <img class="hero__glass-image" src="../../../plugin/fisar-cdj-core/assets/demo/hero-calice-scontornato-fisar-cdj-v2.webp" width="640" height="960" alt="" fetchpriority="high">
          </div>
          <div class="review-carousel-controls classic-controls" hidden aria-label="Controlli dell’album">
            <div class="review-classic-dots" aria-label="Scegli il collage"></div>
            <button type="button" data-action="pause">Pausa</button>
            <span class="screen-reader-text" role="status"></span>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
