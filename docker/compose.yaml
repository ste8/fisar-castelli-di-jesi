name: ${COMPOSE_PROJECT_NAME:-fisar-cdj}

services:
  database:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${WORDPRESS_DB_NAME:-fisar_cdj}
      MARIADB_USER: ${WORDPRESS_DB_USER:-fisar_cdj}
      MARIADB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-fisar_cdj_local}
      MARIADB_ROOT_PASSWORD: ${WORDPRESS_DB_ROOT_PASSWORD:-fisar_cdj_root_local}
    volumes:
      - database_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD
        - healthcheck.sh
        - --connect
        - --innodb_initialized
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  wordpress:
    image: wordpress:7.1.0-php8.3-apache
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "${WP_PORT:-8090}:80"
    environment:
      WORDPRESS_DB_HOST: database:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-fisar_cdj}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-fisar_cdj}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-fisar_cdj_local}
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_ENVIRONMENT_TYPE', 'local' );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'WP_DEBUG_LOG', true );
        define( 'SCRIPT_DEBUG', true );
        define( 'DISALLOW_FILE_EDIT', true );
    volumes:
      - wordpress_data:/var/www/html
      - ../plugin/fisar-cdj-core:/var/www/html/wp-content/plugins/fisar-cdj-core:ro
      - ../theme/fisar-cdj:/var/www/html/wp-content/themes/fisar-cdj:ro
    healthcheck:
      test:
        - CMD-SHELL
        - "php -r '$$socket = @fsockopen(\"127.0.0.1\", 80); exit($$socket ? 0 : 1);'"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  wordpress_cli:
    image: wordpress:cli-2.12.0-php8.3
    depends_on:
      wordpress:
        condition: service_healthy
    user: "33:33"
    working_dir: /var/www/html
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -eu
        if ! wp core is-installed; then
          wp core install \
            --url="${WORDPRESS_SITE_URL:-http://localhost:8090}" \
            --title="${WORDPRESS_SITE_TITLE:-FISAR Castelli di Jesi}" \
            --admin_user="${WORDPRESS_ADMIN_USER:-admin}" \
            --admin_password="${WORDPRESS_ADMIN_PASSWORD:-admin_local_change_me}" \
            --admin_email="${WORDPRESS_ADMIN_EMAIL:-admin@fisar-cdj.test}" \
            --skip-email
        fi
        if ! wp language core is-installed it_IT; then
          wp language core install it_IT
        fi
        if [ "$(wp option get WPLANG)" != "it_IT" ]; then
          wp site switch-language it_IT
        fi
        wp option update timezone_string Europe/Rome
        wp option update date_format 'j F Y'
        wp option update time_format 'H:i'
        if ! wp plugin is-active fisar-cdj-core; then
          wp plugin activate fisar-cdj-core
        fi
        if ! wp theme is-active fisar-cdj; then
          wp theme activate fisar-cdj
        fi
        wp rewrite structure '/%postname%/'
        wp fisar-cdj demo install
    environment:
      HTTP_HOST: localhost:${WP_PORT:-8090}
      SERVER_NAME: localhost
      REQUEST_URI: /
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
      WORDPRESS_DB_HOST: database:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-fisar_cdj}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-fisar_cdj}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-fisar_cdj_local}
    volumes:
      - wordpress_data:/var/www/html
      - ../plugin/fisar-cdj-core:/var/www/html/wp-content/plugins/fisar-cdj-core:ro
      - ../theme/fisar-cdj:/var/www/html/wp-content/themes/fisar-cdj:ro

volumes:
  database_data:
  wordpress_data:
